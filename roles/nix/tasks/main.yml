---
- name: Install Nix
  command: sh <(curl -L https://nixos.org/nix/install)

- name: nix-channel --add
  command: nix-channel --add {{ item }}
  loop:
    - https://channels.nixos.org/nixpkgs-26.05-darwin
    - https://github.com/nix-community/home-manager/archive/release-26.05.tar.gz
    - https://github.com/nix-darwin/nix-darwin/archive/nix-darwin-26.05.tar.gz

- name: nix-channel --update
  command: nix-channel --update

- name: nix-env --install
  command: nix-env --install {{ item }}
  loop:
    - nixpkgs-fmt

- name: nix-env --upgrade
  command: nix-env --upgrade

- name: nix-store --gc
  command: nix-store --gc
